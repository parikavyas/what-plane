<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <title>What Plane</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>What plane is that?</h1>
      <p id="status" role="status">Allow location to see planes above you.</p>
      <button id="locate" type="button">Find planes overhead</button>
    </header>
    <section id="sky" hidden aria-label="Sky view">
      <div id="radar"></div>
      <button id="compass" type="button" class="secondary" aria-pressed="false" hidden>Turn with my phone</button>
    </section>
    <main id="list" aria-live="polite"></main>
    <footer>
      Data from <a href="https://airplanes.live">airplanes.live</a> and
      <a href="https://adsb.lol">adsb.lol</a>, community ADS-B networks. Not for navigation.
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
